<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Survivor</title>
    <style>
      :root {
        --bg: #0b0d13;
        --panel: rgba(14, 17, 26, 0.92);
        --border: #262c3b;
        --text: #e6e9f0;
        --muted: #8b93a7;
        --accent: #6ee7a0;
        --hp: #e05a5a;
        --hp-low: #ff3b3b;
        --xp: #66d9ff;
        --boss: #ff2e63;
        --font: ui-monospace, "SF Mono", "Cascadia Mono", "Consolas", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        -webkit-font-smoothing: antialiased;
        /* A phone treats a drag as scrolling, a double tap as zoom and a long
           press as text selection. All three are the player steering, and any
           of them firing costs a run. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        /* `viewport-fit=cover` puts the page under the notch and the home bar;
           the safe-area insets are what keep the HP bar out from under them. */
        padding: calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
          calc(14px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bar {
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .bar > i {
        display: block;
        height: 100%;
        width: 0%;
        transition: width 90ms linear;
      }

      #xp-fill {
        background: var(--xp);
      }

      #top-row {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 13px;
      }

      #hp-wrap {
        width: 320px;
      }

      #hp-bar {
        position: relative;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.05);
        overflow: hidden;
      }

      #hp-bar > i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        display: block;
      }

      /* The trailing chunk. Sits behind the fill and catches up on a delay, so
         a hit is a pale sliver that visibly drains rather than a number that
         was already different the last time you glanced at the corner. */
      #hp-ghost {
        /* Opaque rather than a translucent red: alpha over a near-black track
           turns muddy brown, which reads as nothing in particular. Three solid
           steps — track, lost, current — are legible at a glance. */
        background: #7d343c;
      }

      #hp-fill {
        background: linear-gradient(180deg, #f07272, var(--hp));
        transition: width 80ms linear;
      }

      /* One divider per fixed chunk of HP, so the bar can be read by counting
         segments instead of parsing the number. Selected by two ids because
         `#hp-bar > i` above is more specific than a bare id and would otherwise
         hold this layer at width 0. */
      #hp-bar > #hp-ticks {
        inset: 0;
        width: 100%;
        background-image: linear-gradient(
          90deg,
          transparent calc(100% - 2px),
          rgba(8, 10, 16, 0.7) calc(100% - 2px)
        );
        background-repeat: repeat-x;
        background-size: 25% 100%;
      }

      #hp-text {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.05em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      }

      #hp-wrap.low #hp-fill {
        background: linear-gradient(180deg, #ff6b6b, var(--hp-low));
        animation: hp-pulse 620ms ease-in-out infinite;
      }

      #hp-wrap.low #hp-bar {
        border-color: var(--hp-low);
        box-shadow: 0 0 12px rgba(255, 59, 59, 0.35);
      }

      @keyframes hp-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      #timer {
        margin-left: auto;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      #stats {
        display: flex;
        gap: 14px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      #boss {
        margin-top: auto;
        align-self: center;
        width: min(620px, 70vw);
        text-align: center;
      }

      #boss[hidden] {
        display: none;
      }

      #boss-name {
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--boss);
        margin-bottom: 6px;
      }

      #boss-fill {
        background: var(--boss);
      }

      #warning {
        position: fixed;
        pointer-events: none;
        top: 20%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 30px;
        letter-spacing: 0.3em;
        color: var(--boss);
        text-shadow: 0 0 18px rgba(255, 46, 99, 0.55);
        animation: warning-pulse 900ms ease-in-out infinite;
      }

      #warning[hidden] {
        display: none;
      }

      @keyframes warning-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      .badge {
        padding: 3px 9px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        white-space: nowrap;
      }

      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(6, 8, 13, 0.78);
        backdrop-filter: blur(3px);
        z-index: 10;
      }

      .overlay[hidden] {
        display: none;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px 32px;
        text-align: center;
        max-width: min(760px, 92vw);
      }

      .panel h2 {
        margin: 0 0 4px;
        font-size: 20px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .panel .sub {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 12px;
      }

      #upgrade-cards {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .card {
        pointer-events: auto;
        position: relative;
        width: 200px;
        padding: 18px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: border-color 120ms, background 120ms, transform 120ms;
      }

      .card:hover,
      .card:focus-visible {
        border-color: var(--accent);
        background: rgba(110, 231, 160, 0.08);
        transform: translateY(-2px);
        outline: none;
      }

      .card .key {
        display: inline-block;
        padding: 1px 7px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .card .name {
        font-size: 14px;
        margin-bottom: 6px;
      }

      .card .desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
      }

      .card .stacks {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }

      /* A first acquisition is the pick worth noticing, whatever its kind. */
      .card .stacks--new {
        color: var(--accent);
        letter-spacing: 0.08em;
      }

      .card .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .card .badge {
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      /* Weapons change how a run plays; stat bumps move a number. Three
         separate channels carry that difference — the badge word, the bar on
         the left edge and the tint — so it survives for a player who cannot
         tell the two colours apart. */
      .card--weapon {
        border-color: rgba(110, 231, 160, 0.45);
        background: rgba(110, 231, 160, 0.06);
      }

      .card--weapon::before {
        content: '';
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--accent);
      }

      .card--weapon .badge {
        border-color: rgba(110, 231, 160, 0.45);
        color: var(--accent);
      }

      #result-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(74px, 1fr));
        gap: 16px;
        margin: 8px 0 24px;
      }

      #result-stats div span {
        display: block;
      }

      #result-stats .value {
        font-size: 24px;
        font-variant-numeric: tabular-nums;
      }

      #result-stats .label {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 22px;
      }

      .action {
        pointer-events: auto;
        padding: 10px 20px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--text);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: border-color 120ms, background 120ms;
      }

      .action:hover {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.07);
      }

      /* Armed: the next press is the one that throws the run away. */
      .action--armed {
        border-color: var(--hp-low);
        background: rgba(255, 59, 59, 0.14);
        color: #ffd9d9;
      }

      .action--armed:hover {
        border-color: var(--hp-low);
        background: rgba(255, 59, 59, 0.2);
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      /* The thumb stick. Drawn where the finger landed, so it has no place of
         its own until there is one. */
      #stick {
        position: fixed;
        z-index: 5;
        width: calc(var(--stick-radius) * 2);
        height: calc(var(--stick-radius) * 2);
        margin: calc(var(--stick-radius) * -1) 0 0 calc(var(--stick-radius) * -1);
        border: 1px solid rgba(230, 233, 240, 0.22);
        border-radius: 50%;
        background: rgba(230, 233, 240, 0.05);
        pointer-events: none;
      }

      #stick[hidden] {
        display: none;
      }

      #stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(110, 231, 160, 0.28);
        border: 1px solid rgba(110, 231, 160, 0.55);
      }

      /* The one control that exists solely because a phone has no Esc: a way to
         open the pause menu at all. Hidden wherever a keyboard is, so the
         desktop screens stay exactly as they were. */
      .touch-only {
        display: none;
      }

      @media (pointer: coarse) {
        .touch-only {
          display: inline-flex;
        }
      }

      #pause-button {
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        position: fixed;
        right: calc(14px + env(safe-area-inset-right));
        bottom: calc(14px + env(safe-area-inset-bottom));
        z-index: 6;
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 50%;
        background: rgba(14, 17, 26, 0.75);
        /* The HUD around it is `pointer-events: none`; this one has to catch. */
        pointer-events: auto;
      }

      /* Phone-sized screens. The debug counters are the first thing to go: they
         are for a developer at a desk, and they cost a line of a small screen
         that the HP bar and the timer need. */
      @media (max-width: 620px) {
        #stat-entities,
        #stat-pool,
        #stat-fps {
          display: none;
        }

        #hud {
          font-size: 12px;
        }

        .panel {
          padding: 20px 16px;
          max-width: 94vw;
        }

        #upgrade-cards {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .card {
          width: auto;
          min-width: 0;
          padding: 12px;
        }

        .card .desc {
          font-size: 11px;
        }

        #result-stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 8px;
        }
      }

      /* A phone held sideways is mostly HUD unless the panels give way. */
      @media (max-height: 480px) and (orientation: landscape) {
        .panel {
          padding: 14px 18px;
        }

        .panel h2 {
          margin: 0 0 6px;
          font-size: 18px;
        }

        #upgrade-cards {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      kbd {
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.05);
        font-family: inherit;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="top-row">
        <span class="badge" id="level">LV 1</span>
        <div id="hp-wrap">
          <div id="hp-bar">
            <i id="hp-ghost"></i>
            <i id="hp-fill"></i>
            <i id="hp-ticks"></i>
            <span id="hp-text">100 / 100</span>
          </div>
        </div>
        <span id="timer">00:00</span>
      </div>
      <div class="bar"><i id="xp-fill"></i></div>
      <div id="stats">
        <span id="stat-weapons">bolt</span>
        <span id="stat-kills">kills 0</span>
        <span id="stat-bosses" hidden>bosses 0</span>
        <span id="stat-entities">enemies 0</span>
        <span id="stat-pool">pool 0</span>
        <span id="stat-fps">-- fps</span>
      </div>

      <div id="boss" hidden>
        <div id="boss-name">THE HORDE'S END</div>
        <div class="bar"><i id="boss-fill"></i></div>
      </div>
    </div>

    <div id="warning" hidden>BOSS INCOMING</div>

    <div id="stick" hidden><div id="stick-knob"></div></div>

    <button id="pause-button" class="touch-only" type="button" aria-label="Pause">II</button>

    <div class="overlay" id="levelup" hidden>
      <div class="panel">
        <h2>Level Up</h2>
        <p class="sub">Pick one — press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> or click</p>
        <div id="upgrade-cards"></div>
      </div>
    </div>

    <div class="overlay" id="pause" hidden>
      <div class="panel">
        <h2>Paused</h2>
        <p class="sub">
          <kbd>Esc</kbd> or <kbd>P</kbd> to resume &middot; <kbd>R</kbd> to restart
        </p>
        <div class="actions">
          <button class="action" id="pause-resume" type="button">Resume</button>
          <button class="action" id="pause-restart" type="button">Restart run</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="result" hidden>
      <div class="panel">
        <h2 id="result-title">Run Over</h2>
        <p class="sub" id="result-sub"></p>
        <div id="result-stats">
          <div><span class="value" id="result-time">00:00</span><span class="label">survived</span></div>
          <div><span class="value" id="result-kills">0</span><span class="label">kills</span></div>
          <div><span class="value" id="result-level">1</span><span class="label">level</span></div>
          <div><span class="value" id="result-bosses">0</span><span class="label">bosses</span></div>
        </div>
        <p class="hint">Press <kbd>R</kbd> to run again</p>
        <div class="actions">
          <button class="action" id="result-again" type="button">Run again</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
