# Publishes the built game to the reg.ru shared host over FTP on every push to
# main, alongside the GitHub Pages deploy. The two are separate workflows on
# purpose: a wrong FTP password should not stop Pages from updating.
#
# Requires four repository secrets (Settings -> Secrets and variables ->
# Actions). All four come from the "услуга активирована" email and the
# hosting panel:
#
#   FTP_SERVER      host to connect to, e.g. ftp.example.ru or the server IP
#   FTP_USERNAME    FTP login
#   FTP_PASSWORD    FTP password
#   FTP_SERVER_DIR  target directory, with a trailing slash, e.g. www/example.ru/

name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two uploads overlap: FTP has no transaction, and a half-written
# index.html pointing at half-uploaded assets is a black screen for players.
concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Same build CI runs, typecheck included, so the host never receives
      # code that would not compile.
      - name: Build
        run: npm run build

      - name: Upload dist/ over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # Encrypted FTP. If the run fails with a TLS or AUTH error, this
          # server does not offer it — change ftps to ftp and rotate the
          # password afterwards, since plain FTP sends it in the clear.
          protocol: ftps
