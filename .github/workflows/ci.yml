name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The server's copy of the leaderboard rules, run against the limits the
      # build just wrote. The endpoint and the game have to agree about what a
      # valid run is: if they drift, the game offers to submit a score and the
      # board refuses it, and a player reads that as the board being broken.
      # Ubuntu runners ship PHP, so this costs a second and needs no setup.
      - name: Test the API's validation
        run: php tests/api.php
